                <h1>Všeobecné obchodní podmínky</h1>
                <p class="doc-sub">pro poskytování darů prostřednictvím stránek darci.darujemekrouzky.cz</p>

                    telefon: <a href="tel:+420773772202">+420&nbsp;773&nbsp;772&nbsp;202</a><br/>
                    (dále jen „provozovatel")</p>

                <h2>2. Úvodní ustanovení</h2>
                <p>Tyto všeobecné obchodní podmínky upravují poskytování peněžitých darů na podporu
                    projektu Darujeme kroužky dětem prostřednictvím darovací stránky
                    darci.darujemekrouzky.cz. Odesláním darovacího formuláře a provedením platby uzavírá
                    dárce s provozovatelem darovací smlouvu podle § 2055 a násl. zákona č. 89/2012 Sb.,
                    občanského zákoníku. Prostřednictvím stránek nedochází k prodeji zboží ani služeb.</p>

                <h2>3. Dary a jejich použití</h2>
                <p>Dárce může poskytnout dar jednorázově, nebo opakovaně v měsíčním či ročním intervalu,
                    a to ve výši, kterou si sám zvolí. Poskytnutí daru je dobrovolné. Dary jsou použity
                    na úhradu volnočasových aktivit dětí z rodin v tíživé finanční situaci a na
                    zajištění projektu Darujeme kroužky dětem, který provozuje Česká rada dětí a mládeže.</p>

                <h2>4. Platební podmínky</h2>
                <p>Dary jsou přijímány v českých korunách (CZK) těmito způsoby:</p>
                <ul>
                    <li><b>platební kartou</b> prostřednictvím zabezpečené platební brány Comgate,
                        kterou provozuje společnost Comgate, a.s., Gočárova třída 1754/48b,
                        500&nbsp;02 Hradec Králové, IČ: 27924505, platební instituce podléhající
                        dohledu České národní banky,</li>
                    <li><b>bankovním převodem</b> (včetně QR platby) na účet provozovatele podle
                        instrukcí zobrazených po odeslání formuláře.</li>
                </ul>
                <p>U opakovaných darů je zvolená částka automaticky strhávána z platební karty dárce
                    v měsíčním, resp. ročním intervalu. Provedením první platby uděluje dárce souhlas
                    s opakovaným strháváním. Opakovaný dar může dárce kdykoli ukončit e-mailem na
                    <a href="mailto:info@darujemekrouzky.cz">info@darujemekrouzky.cz</a> nebo telefonicky;
                    ukončení je účinné pro následující platební období. Provozovatel nemá přístup
                    k údajům o platební kartě dárce — ty zpracovává výhradně provozovatel platební brány.</p>

                <h2>5. Dodací podmínky</h2>
                <p>Předmětem darovací smlouvy není dodání zboží ani poskytnutí služby, žádné plnění se
                    proto dárci nedoručuje. Přijetí daru provozovatel potvrdí e-mailem na adresu uvedenou
                    v darovacím formuláři. Potvrzení o daru pro daňové účely (§ 15 odst. 1, resp.
                    § 20 odst. 8 zákona č. 586/1992 Sb., o daních z příjmů) provozovatel vystaví a zašle
                    na základě volby v darovacím formuláři, případně kdykoli na vyžádání.</p>

                <h2>6. Reklamační podmínky, vrácení daru a storno</h2>
                <p>Pokud při platbě dojde k chybě — zejména k zadání jiné než zamýšlené částky,
                    k duplicitní platbě nebo k neautorizované platbě — může dárce platbu reklamovat
                    e-mailem na <a href="mailto:info@darujemekrouzky.cz">info@darujemekrouzky.cz</a>
                    nebo telefonicky na <a href="tel:+420773772202">+420&nbsp;773&nbsp;772&nbsp;202</a>.
                    Oprávněné reklamace provozovatel vyřídí bez zbytečného odkladu, nejpozději do 30 dnů
                    od doručení; chybně poskytnutá platba bude vrácena na účet či kartu, ze které byla
                    odeslána. Opakovaný dar lze kdykoli stornovat způsobem popsaným v čl. 4; storno je
                    účinné pro následující platební období.</p>

                <h2>7. Ochrana osobních údajů</h2>
                <p>Informace o zpracování osobních údajů dárců jsou uvedeny v dokumentu
                    <a href={privacyUrl}>Zásady ochrany osobních údajů</a>.</p>

                <h2>8. Závěrečná ustanovení</h2>
                <p>Právní vztahy těmito podmínkami výslovně neupravené se řídí právním řádem České
                    republiky, zejména občanským zákoníkem. K mimosoudnímu řešení případných sporů je
                    příslušná Česká obchodní inspekce (<a href="https://www.coi.cz/" target="_blank"
                    rel="noopener">www.coi.cz</a>). Provozovatel je oprávněn tyto podmínky měnit;
                    pro dar je rozhodné znění účinné v okamžiku jeho poskytnutí.</p>
                <p>Tyto podmínky jsou účinné od 21.&nbsp;8.&nbsp;2026.</p>
