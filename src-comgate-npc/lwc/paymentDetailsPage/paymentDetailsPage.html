<!-- Payment Details Page -->
<template>
    <div class="payment-details-box">
        <h2>Payment Details</h2>

        <div class="qr-code-section">
            <c-qr-code-generator payload={qrPayload} class="slds-align_absolute-center"></c-qr-code-generator>
            <p style="font-size: 12px; color: #777; margin-top: 5px;">Scan for quick payment</p>
        </div>

        <div class="payment-info">
            <div class="receiver-details">
                <p><span class="label">Receiver:</span> <span class="value">{receiverName}</span></p>
            </div>

            <p><span class="label">Bank Account:</span> <span class="value">{bankAccount}</span></p>
            <p><span class="label">IBAN:</span> <span class="value">{iban}</span></p>
            <p><span class="label">Variable Symbol:</span> <span class="value">{variableSymbol}</span></p>
            <p><span class="label">Amount:</span> <span class="value">{amount} {currency}</span></p>
            <!-- You can add more fields like Constant Symbol, Specific Symbol if needed -->
            <!-- <p><span class="label">Constant Symbol:</span> <span class="value">{{CONSTANT_SYMBOL}}</span></p> -->
        </div>

        <div class="instructions-section">
            <h3>Instructions for Bank Transfer:</h3>
            <ul>
                <li>Please use the bank account details provided above.</li>
                <li><strong>Crucial:</strong> Enter the <strong>Variable Symbol</strong> correctly to ensure your payment is matched to your order/service.</li>
                <li>The amount to transfer is {amount} {currency}.</li>
                <li>Payments are typically processed within 1-2 business days.</li>
                <li>If you have any questions, please contact us at <a href="mailto:{supportEmail}">{supportEmail}</a>.</li>
            </ul>
        </div>
    </div>
</template>
